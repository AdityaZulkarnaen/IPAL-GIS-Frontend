services:
  # ============================================================
  # PHP-FPM Application
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: ipal-gis-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-custom.ini
    environment:
      - APP_NAME=${APP_NAME:-IPAL-GIS}
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-ipal_gis}
      - DB_USERNAME=${DB_USERNAME:-ipal}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - SESSION_DRIVER=${SESSION_DRIVER:-database}
      - CACHE_STORE=${CACHE_STORE:-database}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ipal-network

  # ============================================================
  # Nginx Web Server
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: ipal-gis-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ipal-network

  # ============================================================
  # MySQL Database
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: ipal-gis-mysql
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-ipal_gis}
      MYSQL_USER: ${DB_USERNAME:-ipal}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ipal-network

  # ============================================================
  # Node.js (Vite Dev Server - Development Only)
  # ============================================================
  node:
    image: node:20-alpine
    container_name: ipal-gis-node
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    command: sh -c "npm install && npm run dev"
    networks:
      - ipal-network

# ============================================================
# Volumes
# ============================================================
volumes:
  mysql_data:
    driver: local
  node_modules:
    driver: local

# ============================================================
# Networks
# ============================================================
networks:
  ipal-network:
    driver: bridge
